<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhatsApp Business Demo</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <img src="https://ui-avatars.com/api/?name=Business&background=25D366&color=fff&size=40" class="avatar" alt="avatar"/>
        <div class="header-icons">
          <i class="fa-solid fa-circle-dot"></i>
          <i class="fa-solid fa-message"></i>
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
      </div>

      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search or start new chat" />
      </div>

      <div class="chat-list" id="chatList">
        <!-- Contacts injected by JS -->
      </div>
    </div>

    <!-- Chat Window -->
    <div class="chat-window">
      <div class="chat-header" id="chatHeader">
        <img src="https://ui-avatars.com/api/?name=Bot&background=25D366&color=fff&size=40" class="avatar" alt="avatar" id="chatAvatar"/>
        <div class="chat-header-info">
          <h4 id="chatName">WhatsApp Bot</h4>
          <span id="chatStatus">online</span>
        </div>
        <div class="header-icons">
          <i class="fa-solid fa-video"></i>
          <i class="fa-solid fa-phone"></i>
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="messages-inner" id="messagesInner">
          <!-- Messages injected by JS -->
        </div>
      </div>

      <div class="input-bar">
        <i class="fa-solid fa-face-smile emoji-btn"></i>
        <i class="fa-solid fa-paperclip attach-btn"></i>
        <input type="text" id="messageInput" placeholder="Type a message" autocomplete="off"/>
        <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
